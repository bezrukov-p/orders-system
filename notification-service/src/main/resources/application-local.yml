spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_NOTIFICATION_PORT:5434}/${DB_NOTIFICATION_NAME:notifications_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:29092}

logging:
  level:
    com.bezrukov: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE