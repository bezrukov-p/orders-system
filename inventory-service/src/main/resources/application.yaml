spring:
  application:
    name: inventory-service
  liquibase:
    enabled: true
    change-log: classpath:/db/inventory/changelog/db.changelog-master-inventory.yaml
  datasource:
    url: jdbc:postgresql://localhost:5433/products_db
    username: admin
    password: admin
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        logging:
          level:
            sql: DEBUG
  grpc:
    server:
      port: 9090
      security:
        csrf:
          enabled: false
admin:
  apikey: "admin-key"
server:
  port: 8081