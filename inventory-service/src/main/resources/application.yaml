spring:
  application:
    name: inventory-service
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    url: jdbc:postgresql://localhost:5433/products_db
    username: admin
    password: admin
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        logging:
          level:
            sql: DEBUG
admin:
  apikey: "admin-key"
server:
  port: 8081