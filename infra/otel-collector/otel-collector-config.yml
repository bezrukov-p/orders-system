receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Защита от OOM коллектора
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Батчинг — снижает количество запросов к экспортёрам
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # (Опционально) Единый набор resource-атрибутов для всех сигналов
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # Логи → Loki по OTLP HTTP
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Метрики → Prometheus (pull через :8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  # Трейсы → Jaeger по OTLP gRPC
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # Debug — только для отладки, ОТКЛЮЧИ в обычной работе
  # debug:
  #   verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
      # для отладки добавь debug: exporters: [debug, otlphttp/loki]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]