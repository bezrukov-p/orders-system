syntax = "proto3";

package inventory;

option java_package = "com.bezrukov.common.grpc";
option java_multiple_files = true;

service InventoryService {
  rpc CheckAvailability (ProductRequest) returns (ProductResponse);
}

message ProductRequest {
  int64 productId = 1;
  int64 quantity = 2;
}

message ProductResponse {
  int64 id = 1;
  string name = 2;
  int64 quantity = 3;
  double price = 4;
  int32 salePercent = 5;
}